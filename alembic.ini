# LedgerForge — Alembic configuration.
#
# The database URL is deliberately NOT stored here; db/migrations/env.py
# resolves it from LF_DATABASE_URL (preferred) or DATABASE_URL.
#
# Migration policy (docs/adr/006-migration-baseline.md):
#   * revisions are handwritten raw SQL — the schema is trigger/function
#     heavy (Law 1 / Law 2 enforcement lives in plpgsql), which Alembic's
#     autogenerate cannot see;
#   * revision 0001 embeds db/schema.sql + db/functions.sql verbatim, and
#     tests/test_migrations.py fails CI if the two ever drift apart;
#   * db/schema.sql stays the bootstrap path and remains idempotent.

[alembic]
script_location = db/migrations
# Readable, sortable file names: 0002_multi_currency.py, 0003_period_locking.py, ...
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
timezone = UTC
truncate_slug_length = 40

# url — resolved from the environment by env.py; do not set it here.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
