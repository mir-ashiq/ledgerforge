name: release-windows

# The desktop edition's release pipeline (ADR-021): every v* tag builds
# LedgerForge.exe on a real Windows runner, proves the shipped binary boots
# (embedded PostgreSQL -> schema -> /health -> web UI) with --smoke, and
# publishes it as a GitHub Release. A failed smoke test fails the release —
# the artifact is proven, not assumed.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json

      - name: Install engine + packaging
        run: pip install -e ".[desktop,dev]" pyinstaller

      - name: Build the web UI
        working-directory: frontend/web
        run: |
          npm ci
          npm run build

      - name: Windows version resource (generated from ledgerforge.__version__)
        run: python scripts/make_version_info.py | Out-File -Encoding ascii desktop/version_info.txt

      - name: Build LedgerForge.exe
        run: pyinstaller desktop/ledgerforge.spec --noconfirm

      # The default data dir (%LOCALAPPDATA%\LedgerForge) is deliberate: it
      # is precisely what an end user gets, and the runner's D:-drive
      # RUNNER_TEMP carries ACLs that initdb cannot reset ("could not change
      # permissions"). A clean machine, the real default path, the shipped
      # bytes — nothing else.
      - name: Smoke test the shipped exe (default data dir)
        timeout-minutes: 10
        run: ./dist/LedgerForge/LedgerForge.exe --smoke

      - name: Package the zip + checksums
        run: |
          $tag = "${{ github.ref_name }}"
          Copy-Item desktop/QUICKSTART.txt dist/LedgerForge/
          Compress-Archive -Path dist/LedgerForge -DestinationPath "LedgerForge-$tag-win64.zip"
          $hash = (Get-FileHash "LedgerForge-$tag-win64.zip" -Algorithm SHA256).Hash
          "$hash  LedgerForge-$tag-win64.zip" | Out-File -Encoding ascii checksums.txt
          Get-Content checksums.txt

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TITLE: "LedgerForge ${{ github.ref_name }} — the desktop edition"
        run: >
          gh release create "${{ github.ref_name }}"
          "LedgerForge-${{ github.ref_name }}-win64.zip" checksums.txt
          --title "$env:RELEASE_TITLE"
          --notes-file desktop/RELEASE_NOTES.md
