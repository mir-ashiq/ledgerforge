name: release-windows

# The native application's release pipeline (ADR-022): every v* tag builds
# LedgerForge.exe — a real Windows program: a Qt window, no browser — on a
# real Windows runner, proves the SHIPPED binary boots (engine child process
# -> embedded PostgreSQL -> schema -> /health -> the native window, offscreen)
# with --smoke, and publishes it as a GitHub Release. A failed smoke fails
# the release — the artifact is proven, not assumed.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-native:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install engine + window + packaging
        run: pip install -e ".[gui,dev]" pyinstaller

      - name: Windows version resource (generated from ledgerforge.__version__)
        run: python scripts/make_version_info.py | Out-File -Encoding ascii desktop/version_info.txt

      - name: Build LedgerForge.exe (the native window)
        run: pyinstaller desktop/ledgerforge.spec --noconfirm

      # The default data dir (%LOCALAPPDATA%\LedgerForge) is deliberate: it
      # is precisely what an end user gets, and the runner's D:-drive
      # RUNNER_TEMP carries ACLs that initdb cannot reset ("could not change
      # permissions"). A clean machine, the real default path, the shipped
      # bytes — nothing else.
      #
      # The exe is a GUI-subsystem binary: PowerShell does not wait on those,
      # so Start-Process -Wait carries the exit code, and the smoke's stdout
      # is redirected to a file (GUI apps detach from the console).
      # QT_QPA_PLATFORM=offscreen: the window is constructed without a
      # display — the same widgets the user sees, proven on a headless runner.
      - name: Smoke test the shipped exe (offscreen, default data dir)
        timeout-minutes: 10
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $proc = Start-Process -FilePath ".\dist\LedgerForge\LedgerForge.exe" `
            -ArgumentList "--smoke" -Wait -PassThru -NoNewWindow `
            -RedirectStandardOutput smoke-out.log -RedirectStandardError smoke-err.log
          Get-Content smoke-out.log
          Get-Content smoke-err.log -ErrorAction SilentlyContinue
          if ($proc.ExitCode -ne 0) {
            Write-Host "::error::LedgerForge.exe --smoke exited with $($proc.ExitCode)"
            exit 1
          }

      - name: Package the zip + checksums
        run: |
          $tag = "${{ github.ref_name }}"
          Copy-Item desktop/QUICKSTART.txt dist/LedgerForge/
          Compress-Archive -Path dist/LedgerForge -DestinationPath "LedgerForge-$tag-win64.zip"
          $hash = (Get-FileHash "LedgerForge-$tag-win64.zip" -Algorithm SHA256).Hash
          "$hash  LedgerForge-$tag-win64.zip" | Out-File -Encoding ascii checksums.txt
          Get-Content checksums.txt

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TITLE: "LedgerForge ${{ github.ref_name }} — the native Windows application"
        run: >
          gh release create "${{ github.ref_name }}"
          "LedgerForge-${{ github.ref_name }}-win64.zip" checksums.txt
          --title "$env:RELEASE_TITLE"
          --notes-file desktop/RELEASE_NOTES.md
