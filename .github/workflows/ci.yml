name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      # The native app's offscreen Qt tests (ADR-022) need the GUI stack's
      # system libraries — headless, no display, QT_QPA_PLATFORM=offscreen.
      - name: Qt system libraries (offscreen)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Tests (real PostgreSQL)
        run: python -m pytest -v
        env:
          LF_TEST_ADMIN_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
          QT_QPA_PLATFORM: offscreen

      - name: Alembic CLI smoke (upgrade, stamp, downgrade on a scratch database)
        run: |
          python - <<'PY'
          import psycopg
          dsn = "postgresql://postgres:postgres@localhost:5432/postgres"
          with psycopg.connect(dsn, autocommit=True) as conn:
              conn.execute("DROP DATABASE IF EXISTS lf_ci_alembic WITH (FORCE)")
              conn.execute("CREATE DATABASE lf_ci_alembic")
          PY
          export LF_DATABASE_URL=postgresql+psycopg://postgres:postgres@localhost:5432/lf_ci_alembic
          alembic upgrade head
          alembic current
          alembic downgrade base
          alembic upgrade head

      - name: Baseline integrity (0001 still embeds the frozen snapshot)
        run: python scripts/regen_baseline.py --check

      - name: Benchmark smoke (proves the harness runs)
        run: |
          python scripts/bench_hierarchy.py --admin-dsn postgresql://postgres:postgres@localhost:5432/postgres
          python scripts/bench_posting.py --admin-dsn postgresql://postgres:postgres@localhost:5432/postgres
          python scripts/bench_scale_out.py --smoke --admin-dsn postgresql://postgres:postgres@localhost:5432/postgres

  keyboard-kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Typecheck
        working-directory: frontend/keyboard-kit
        run: |
          npm ci
          npx tsc --noEmit

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json

      - name: Typecheck, tests, production build
        working-directory: frontend/web
        run: |
          npm ci
          npx tsc --noEmit
          npx vitest run
          npm run build

  # Browser-level E2E (v0.16): the jsdom suite proves components; this job
  # proves the assembled product — vite proxy → FastAPI engine → real
  # PostgreSQL — with the full keyboard flow and zero mouse input (ADR-004).
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json

      - name: Install engine
        run: pip install -e ".[dev]"

      - name: Fresh E2E database (lf_e2e)
        run: >
          python scripts/e2e_setup_db.py
          --admin-url postgresql://postgres:postgres@localhost:5432/postgres

      - name: Frontend deps + Chromium
        working-directory: frontend/web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: The keyboard flow, end to end
        working-directory: frontend/web
        run: npx playwright test
        env:
          E2E_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/lf_e2e
