[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ledgerforge"
version = "0.19.0"
description = "Community-driven, keyboard-first, double-entry business management engine — inspired by TallyPrime"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
authors = [{ name = "mir-ashiq", email = "imsrenpsycho@gmail.com" }]
keywords = [
    "accounting", "double-entry", "ledger", "tally", "tallyprime", "erp",
    "bookkeeping", "gst", "postgresql", "fastapi", "open-source",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyjwt[crypto]>=2.8",
    "cryptography>=42",  # imported directly by the plugin trust gate (ADR-016)
    "httpx>=0.27",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.5",
    "pgserver>=0.1",
    "pytest-qt>=4.4",
    "PySide6>=6.6",
    "Pillow>=10.3",
]
# The zero-config desktop edition (ADR-021): the pgserver portable
# PostgreSQL distribution — the embedded database behind
# `ledgerforge desktop` and the Windows build.
desktop = [
    "pgserver>=0.1",
]
# The native Windows application (ADR-022): the Qt 6 shell that replaces
# the v0.17 browser window — a real desktop program, menus and dialogs of
# its own, no browser anywhere in the loop.
gui = [
    "pgserver>=0.1",
    "PySide6>=6.6",
]

[project.urls]
Homepage = "https://github.com/mir-ashiq/ledgerforge"
Repository = "https://github.com/mir-ashiq/ledgerforge"
Issues = "https://github.com/mir-ashiq/ledgerforge/issues"
Changelog = "https://github.com/mir-ashiq/ledgerforge/releases"

[project.scripts]
ledgerforge = "ledgerforge.__main__:main"
ledgerforge-desktop = "ledgerforge.desktop:main"
ledgerforge-native = "ledgerforge.nativeapp:main"
lf-irn-bridge = "ledgerforge.contrib.irn_bridge:main"

[project.entry-points."ledgerforge.plugins"]
gst = "ledgerforge.contrib.gst"
invoicing = "ledgerforge.contrib.invoicing"
inventory = "ledgerforge.contrib.inventory"
payroll = "ledgerforge.contrib.payroll"
statutory = "ledgerforge.contrib.statutory"
example_slot = "ledgerforge.contrib.example_slot"

[tool.hatch.build.targets.wheel]
packages = ["src/ledgerforge"]

# Ship the SQL sources inside the wheel so `python -m ledgerforge.bootstrap`
# works for non-editable installs (e.g. the Docker image).
[tool.hatch.build.targets.wheel.force-include]
"db" = "ledgerforge/sql"

[tool.ruff]
line-length = 100
target-version = "py311"
# community/plugins holds RELEASED artifacts: their bytes are pinned by
# sha256 + signature in index.json — the formatter never touches them.
extend-exclude = ["community"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The baseline embeds db/schema.sql + db/functions.sql byte-for-byte; their
# line lengths are theirs, not ours. Handwritten revisions stay E501-clean.
"db/migrations/versions/0001_baseline.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
